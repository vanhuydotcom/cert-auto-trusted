name: Build Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Root CA file
        shell: pwsh
        run: |
          Write-Host "Checking for Root CA file..."
          if (-not (Test-Path "certs\rootCA.pem")) {
            Write-Error "certs\rootCA.pem not found! Commit it before opening a PR (see GITHUB_ACTIONS_SETUP.md)."
            exit 1
          }
          Write-Host "✓ Found certs\rootCA.pem"

          # Validate it is a self-signed CA
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("certs\rootCA.pem")
          if ($cert.Subject -ne $cert.Issuer) {
            Write-Error "rootCA.pem is not self-signed (Subject != Issuer)."
            exit 1
          }
          $bc = $cert.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.19' }
          if (-not $bc -or -not $bc.CertificateAuthority) {
            Write-Error "rootCA.pem does not have BasicConstraints CA:TRUE."
            exit 1
          }
          Write-Host "✓ Root CA validation passed"

          # Safety net: refuse to build if any private key is present
          $leaked = Get-ChildItem -Recurse -File -Include *-key.pem,*.key,key.pem,*.pfx,*.p12 -ErrorAction SilentlyContinue
          if ($leaked) {
            Write-Error "Private key files detected in repository: $($leaked.FullName -join ', ')"
            exit 1
          }
          Write-Host "✓ No private key files found in repository"

      - name: Install ps2exe
        shell: pwsh
        run: |
          Write-Host "Installing ps2exe module..."
          Install-Module -Name ps2exe -Scope CurrentUser -Force -Verbose
          Write-Host "✓ ps2exe installed successfully"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Write-Host "Downloading Inno Setup..."
          $innoUrl = "https://jrsoftware.org/download.php/is.exe"
          $innoInstaller = "$env:TEMP\innosetup.exe"

          Invoke-WebRequest -Uri $innoUrl -OutFile $innoInstaller

          Write-Host "Installing Inno Setup..."
          Start-Process -FilePath $innoInstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait

          Write-Host "✓ Inno Setup installed successfully"

      - name: Test build
        shell: pwsh
        run: |
          Write-Host "Testing build process..."
          .\build.ps1

          if (-not (Test-Path "dist\CertAutoTrust-Setup-1.0.0.exe")) {
            Write-Error "Build test failed: Installer not found!"
            exit 1
          }

          $fileSize = (Get-Item "dist\CertAutoTrust-Setup-1.0.0.exe").Length
          Write-Host "✓ Build test completed successfully"
          Write-Host "Installer size: $([math]::Round($fileSize/1MB, 2)) MB"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-installer
          path: dist/CertAutoTrust-Setup-1.0.0.exe
          retention-days: 7

      - name: Test Summary
        shell: pwsh
        run: |
          Write-Host "========================================" -ForegroundColor Green
          Write-Host "✓ Build Test Passed!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "The build process completed successfully."
          Write-Host "Installer artifact uploaded for review."
          Write-Host ""
